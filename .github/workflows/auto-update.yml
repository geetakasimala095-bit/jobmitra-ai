name: JobMitra AI Automatic Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:

  check-jobs:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout JobMitra AI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Automatic Job Checker
        run: node backend/checker.js
